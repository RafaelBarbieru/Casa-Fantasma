<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Casa Fantasma</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Courier New", Courier, ui-monospace, monospace; font-weight: bold; color: #b9ad97;
  }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7vh;
    background: #000; transition: opacity .8s; letter-spacing: .25em; text-transform: uppercase; font-size: 14px;
  }
  #overlay.ready { cursor: pointer; }
  #overlay.ready #status { animation: blink 1.1s steps(1) infinite; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #warning {
    max-width: min(560px, calc(100vw - 32px)); padding: 0 16px; box-sizing: border-box; text-align: center;
    font-size: 11px; line-height: 1.6; letter-spacing: .12em; color: #7d7462;
  }
  #warning h2 { margin: 0 0 .6em; font-size: 12px; letter-spacing: .3em; color: #b0301f; }
  #warning p { margin: 0 0 .6em; }
  @keyframes blink { 60% { opacity: 0; } }
  #rotate {
    display: none; position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 2;
    justify-content: center; pointer-events: none; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; opacity: .6;
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  #debug {
    position: absolute; top: 8px; left: 8px; z-index: 4; padding: 6px 8px; white-space: pre; pointer-events: none;
    font: 11px/1.4 ui-monospace, Consolas, monospace; color: #9f9; background: rgba(0,0,0,.6); letter-spacing: 0;
  }
  #debug-markers { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  #debug-markers .slot {
    position: absolute; transform: translate(-50%, -50%); font: 10px ui-monospace, Consolas, monospace; color: #f80;
    border: 1px dashed #f80; padding: 2px 4px; background: rgba(0,0,0,.4);
  }
  #debug-markers .slot.used { color: #0f0; border-color: #0f0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div id="status">Loading</div>
  <div id="warning">
    <h2>Warning</h2>
    <p>This game contains loud noises, sudden screams and flickering, flashing lights, which may trigger seizures in people with photosensitive epilepsy.</p>
    <p>Flickering lights can be turned off in Options &gt; Game &gt; Epilepsy mode.</p>
  </div>
</div>
<div id="rotate">Rotate your device</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
